<div class="container">
    <h2>Scanner</h2>
    <div id="scan-main-card" class="card scan-main-card">
        <h3>Scanner la carte étudiant</h3>
        <div class="scan-top-layout">
            <div class="camera-container scan-camera-panel">
                <video id="qr-video" class="qr-video" muted playsinline></video>
                <p id="camera-status" class="camera-status">Initialisation de la camera...</p>
                <div class="camera-actions">
                    <label class="camera-switch" for="camera-toggle">
                        <input id="camera-toggle" type="checkbox" checked>
                        <span class="camera-switch-slider" aria-hidden="true"></span>
                        <span id="camera-toggle-label" class="camera-switch-label">Camera allumee</span>
                    </label>
                </div>
            </div>
            <div id="scan-result" class="scan-result scan-student-panel">
                <p>Nom : <span id="name-value">---</span></p>
                <p>Classe : <span id="class-value">---</span></p>
                <p>Type de passage : <span id="type-value">---</span></p>
                <p>Statut : <span id="status-value" class="status-badge">---</span></p>
            </div>
        </div>
        <div class="form-container scan-input-hidden" aria-hidden="true">
            <input type="text" id="scan-input" placeholder="Scanner la carte ou entrer l'ID étudiant" autofocus autocomplete="off">
        </div>
        <div id="message" class="message"></div>
    </div>

    <div class="card">
        <h3>Emploi du temps du jour</h3>
        <table>
            <thead>
                <tr>
                    <th>8H15</th>
                    <th>9H05</th>
                    <th>10H10</th>
                    <th>11H00</th>
                    <th>11H50</th>
                    <th>12H40</th>
                    <th>13H30</th>
                    <th>14H20</th>
                    <th>15H10</th>
                    <th>16H00</th>
                </tr>
            </thead>
            <tbody id="scan-schedule-body">
                <!-- Rows will être peuplées par JavaScript -->
            </tbody>
        </table>
    </div>
</div>
