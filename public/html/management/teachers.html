<div class="card">
    <h3>Ajouter un professeur</h3>
    <div class="form-container mgmt-form-inline">
        <input type="text" id="teacher-nom" placeholder="Nom" class="mgmt-control-auto">
        <input type="text" id="teacher-prenom" placeholder="Prénom" class="mgmt-control-auto">
        <input type="email" id="teacher-email" placeholder="Email" class="mgmt-control-auto">
        <input type="text" id="teacher-username" placeholder="Username" class="mgmt-control-auto">
        <button id="btn-add-teacher">Ajouter</button>
    </div>
</div>
<div class="card">
    <h3>Professeurs</h3>
    <table>
        <thead>
            <tr>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Email</th>
                <th>Username</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="teachers-table-body"></tbody>
    </table>
</div>
